name: Windows build and package

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: 'Package version, for example 1.0.0 (optional)'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: windows-package-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    name: Build, test and package Windows x64
    runs-on: windows-2025-vs2026
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Cache NuGet packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: packages
          key: windows-nuget-${{ hashFiles('packages.config', 'NuGet.config') }}

      - name: Determine package version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            $version = $env:GITHUB_REF_NAME -replace '^v', ''
          } elseif ($env:INPUT_VERSION) {
            $version = $env:INPUT_VERSION
          } else {
            $version = "0.1.0-ci.$env:GITHUB_RUN_NUMBER"
          }
          if ($version -notmatch '^\d+\.\d+\.\d+(?:-[0-9A-Za-z]+(?:[.-][0-9A-Za-z]+)*)?$') {
            throw "Invalid package version: $version"
          }
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Build Release and run core integration tests
        run: ./scripts/build.ps1 -Configuration Release -Tests

      - name: Create installer and portable package
        env:
          PACKAGE_VERSION: ${{ steps.version.outputs.version }}
        run: ./scripts/package.ps1 -Version $env:PACKAGE_VERSION

      - name: Verify distribution files
        env:
          PACKAGE_VERSION: ${{ steps.version.outputs.version }}
        run: ./tests/PackagingTests.ps1 -PackageDirectory (Join-Path ./artifacts/packages $env:PACKAGE_VERSION)

      - name: Upload Windows packages
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: CompIntel3-${{ steps.version.outputs.version }}-windows-x64
          path: artifacts/packages/${{ steps.version.outputs.version }}/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

      - name: Upload test diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-test-diagnostics
          path: build/tests/Testing/Temporary/
          if-no-files-found: ignore
          retention-days: 7

  release:
    name: Publish tagged release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download Windows packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: CompIntel3-*-windows-x64
          path: dist
          merge-multiple: true

      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" dist/* --clobber
          else
            extra=()
            if [[ "$RELEASE_TAG" == *-* ]]; then extra+=(--prerelease); fi
            gh release create "$RELEASE_TAG" dist/* --verify-tag --generate-notes "${extra[@]}"
          fi
